name: boul_o_metre
description: Application Android pour mesurer les distances en pétanque.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+7
  path_provider: ^2.1.1
  path: ^1.8.3
  image: ^4.1.3
  image_picker: ^1.0.4
  flutter_bloc: ^8.1.3
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/