name: boul_o_metre
description: Application Android pour mesurer les distances en pétanque.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  path_provider: ^2.1.1
  path: ^1.8.3
  image: ^4.1.4
  image_picker: ^1.1.2
  flutter_bloc: ^9.1.1
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  vector_math: ^2.4.1
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
