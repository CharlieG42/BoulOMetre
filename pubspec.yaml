name: boul_o_metre
description: Application Android pour mesurer les distances en pétanque.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: 0.10.5+7
  path_provider: ^2.1.1
  path: ^1.8.3
  image: ^4.1.3
  image_picker: ^1.0.4
  permission_handler: ^11.2.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
