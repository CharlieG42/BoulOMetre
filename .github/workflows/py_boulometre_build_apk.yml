name: PyBoulOMetre Build APK

on:
  push:
    branches: [ py-kivy-version, main ]
  pull_request:
    branches: [ py-kivy-version, main ]

jobs:
  build_apk:
    name: Build Android APK with Buildozer
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          echo "=== Installing system dependencies ==="
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y openjdk-17-jdk-headless
          echo "=== System dependencies installed ==="
      
      - name: Install Buildozer
        run: |
          echo "=== Installing Buildozer ==="
          python -m pip install --upgrade pip
          pip install buildozer
          buildozer --version
          echo "=== Buildozer installed ==="
      
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          sdk-version: '33'
          ndk-version: '25.2.9519653'
          cmake-version: '3.22.1'
      
      - name: Set Android environment variables
        run: |
          echo "=== Setting Android environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_PATH=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools:$ANDROID_NDK_HOME:$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
          echo "=== Android environment set ==="
      
      - name: Accept Android licenses
        run: |
          echo "=== Accepting Android licenses ==="
          yes | sdkmanager --licenses || true
          echo "=== Licenses accepted ==="
      
      - name: Verify environment
        run: |
          echo "=== Verifying Environment ==="
          java -version
          adb version
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          echo "=== Environment verified ==="
      
      - name: Build APK with Buildozer
        working-directory: py_boulometre
        run: |
          echo "=== Starting Buildozer build ==="
          mkdir -p logs
          buildozer -v android debug 2>&1 | tee logs/build.log || true
          echo "=== Build completed ==="
        timeout-minutes: 90
        continue-on-error: true
      
      - name: Find and upload APK
        working-directory: py_boulometre
        run: |
          echo "=== Searching for APK ==="
          APK_FILE=$(find . -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            NEW_APK_NAME="PyBoulOMetre-${{ github.run_number }}-debug.apk"
            cp "$APK_FILE" "$NEW_APK_NAME"
            echo "APK_FILE=$NEW_APK_NAME" >> $GITHUB_ENV
            mkdir -p artifacts
            cp "$NEW_APK_NAME" artifacts/
          else
            echo "No APK found"
          fi
          echo "=== APK search completed ==="
        continue-on-error: true
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PyBoulOMetre-APK
          path: py_boulometre/artifacts/
          retention-days: 7
      
      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: py_boulometre/logs/
          retention-days: 3
